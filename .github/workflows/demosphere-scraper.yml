name: Demosphere Scraper

on:
  schedule:
    # Sunday 10:23 PM Arizona time (UTC-7, no daylight saving) = Monday 05:23 UTC: after the weekend's games,
    # before YSSL (08:15), data hygiene (11:00) and rankings (12:30).
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season label on the site, e.g. Fall2026 (blank = the current season, else the one before)'
        required: false
        default: ''
      since:
        description: 'Import games on or after this date, YYYY-MM-DD (blank = August 1 of the season)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (scrape and report, write nothing)'
        type: boolean
        required: false
        default: false

env:
  # Freezes team-creating imports across the 2026-08-01 age-group rollover; set to
  # 'false' to lift, once the rollover is applied and verified. The roster pass
  # creates unmatched teams with an age read against the wall-clock season, so
  # during the gap a new team is stored one cohort off and then rolled again.
  # Gates test == 'false' (not != 'true') so a renamed or deleted flag leaves the
  # step skipped. See CLAUDE.md.
  AGE_ROLLOVER_FREEZE: 'false'

concurrency:
  group: demosphere-scraper
  cancel-in-progress: false

jobs:
  scrape-demosphere:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p data/raw/demosphere

      - name: Scrape NCSL, register teams, import games
        if: ${{ env.AGE_ROLLOVER_FREEZE == 'false' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SEASON_INPUT: ${{ github.event.inputs.season }}
          SINCE_INPUT: ${{ github.event.inputs.since }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          # The whole season to date on every run, not one week: a game held while its team waits
          # in the review queue imports on the first run after the review, and the importer skips
          # games it already holds.
          ARGS=(--output-dir data/raw/demosphere)
          if [ -n "${SEASON_INPUT:-}" ]; then
            ARGS+=(--season "${SEASON_INPUT}")
          fi
          if [ -n "${SINCE_INPUT:-}" ]; then
            ARGS+=(--since "${SINCE_INPUT}")
          fi
          if [ "${DRY_RUN_INPUT:-false}" != "true" ]; then
            ARGS+=(--execute)
          fi
          python scripts/import_demosphere.py "${ARGS[@]}" | tee data/raw/demosphere/run.log

          # A run that read no scored games in season is a broken scrape, not a quiet week.
          PLAYED=$(grep -oE 'Games scraped: [0-9]+ \([0-9]+ played\)' data/raw/demosphere/run.log | grep -oE '[0-9]+ played' | grep -oE '[0-9]+' || echo 0)
          MONTH=$(date -u +%m)
          if [ "${PLAYED}" = "0" ] && [[ "${MONTH}" =~ ^(10|11|04|05)$ ]]; then
            echo "::error::Demosphere run read zero scored games in season"
            exit 1
          fi

      - name: Summarize the run
        if: always()
        run: |
          if [ -f data/raw/demosphere/run.log ]; then
            {
              echo '### NCSL (Demosphere) import'
              echo '```'
              sed -n '/(Demosphere)/,/^└/p' data/raw/demosphere/run.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload CSVs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: demosphere-${{ github.run_id }}
          path: data/raw/demosphere/
          if-no-files-found: ignore
          retention-days: 30
