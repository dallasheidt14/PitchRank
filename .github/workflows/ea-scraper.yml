name: EA Scraper

# Modular11 Elite Academy League (tournament 27), separate from the MLS NEXT workflows.
# One age group per manual run; writes CSVs to an artifact and nothing to the database.

on:
  workflow_dispatch:
    inputs:
      age:
        description: 'EA age group to scrape (one per run)'
        required: true
        type: choice
        options: [u11, u12, u13, u14, u15, u16, u17, u19]

concurrency:
  group: ea-scraper
  cancel-in-progress: false

jobs:
  scrape-ea:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Scrape EA roster and games
        env:
          PYTHONPATH: ${{ github.workspace }}
          AGE: ${{ inputs.age }}
        run: |
          set -euo pipefail
          python scripts/scrape_modular11_ea.py --age "$AGE" | tee scrape_counts.txt

      - name: Build match report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          AGE: ${{ inputs.age }}
        run: |
          set -euo pipefail
          python scripts/match_modular11_ea_teams.py --age "$AGE" | tee match_counts.txt

      - name: Upload EA output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ea-scraper-${{ inputs.age }}-${{ github.run_id }}
          path: data/modular11_ea/${{ inputs.age }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          AGE: ${{ inputs.age }}
        run: |
          {
            echo "## EA Scraper — ${AGE}"
            echo "- Scrape: $(cat scrape_counts.txt 2>/dev/null || echo 'did not finish')"
            echo "- Match report: $(cat match_counts.txt 2>/dev/null || echo 'did not finish')"
          } >> "$GITHUB_STEP_SUMMARY"
