name: Enqueue Opponent Frontier
run-name: >-
  Enqueue opponent frontier · ${{
    inputs.dry_run == true && 'DRY RUN' || 'live'
  }}

on:
  schedule:
    # 08:43 UTC daily (01:43 Arizona). Both drainers take priority-2 rows oldest
    # first, so this slot puts these rows after yesterday-games (07:13) and ahead
    # of active-teams (10:28). Scheduled runs here have started hours past their
    # cron under load, so the order is best effort; the 7-day window covers a late
    # or skipped run.
    #
    # Minute 43, not 0: minute 0 is the most contended slot on GitHub's scheduler
    # and scheduled runs are dropped under load. The enqueue jobs use spread
    # minutes so they cannot collide with each other either.
    - cron: '43 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: run every read and check without enqueueing'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Max teams to enqueue (blank = 1000)'
        required: false
        type: string
        default: ''
      window_days:
        description: 'Read opponents from games saved within this many days (blank = 7)'
        required: false
        type: string
        default: ''
      rescrape_after_days:
        description: 'On a day with no never-scraped team, re-queue teams last scraped this many days ago (blank = 14)'
        required: false
        type: string
        default: ''

concurrency:
  group: enqueue-opponent-frontier
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN_FLAG: ${{ inputs.dry_run == true && '--dry-run' || '' }}
      LIMIT_FLAG: ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }}
      WINDOW_FLAG: ${{ inputs.window_days != '' && format('--window-days {0}', inputs.window_days) || '' }}
      RESCRAPE_FLAG: ${{ inputs.rescrape_after_days != '' && format('--rescrape-after-days {0}', inputs.rescrape_after_days) || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Constrained to the versions CI tests against.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv -c requirements.lock

      - name: Enqueue opponent frontier
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python scripts/enqueue_opponent_frontier.py $DRY_RUN_FLAG $LIMIT_FLAG $WINDOW_FLAG $RESCRAPE_FLAG
