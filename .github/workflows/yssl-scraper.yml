name: YSSL Scraper

on:
  schedule:
    # Monday 08:15 UTC: after the weekend's games, before data hygiene (11:00) and rankings (12:30).
    - cron: '15 8 * * 1'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Import games dated within this many days (default covers the season so far)'
        required: false
        default: '120'
      clubs:
        description: 'Space-separated YSSL club codes to walk (blank = all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (scrape and report, write nothing)'
        type: boolean
        required: false
        default: false

env:
  # Freezes team-creating imports across the 2026-08-01 age-group rollover; set to
  # 'false' to lift, once the rollover is applied and verified. The roster pass
  # creates unmatched teams with an age read against the wall-clock season, so
  # during the gap a new team is stored one cohort off and then rolled again.
  # Gates test == 'false' (not != 'true') so a renamed or deleted flag leaves the
  # step skipped. See CLAUDE.md.
  AGE_ROLLOVER_FREEZE: 'false'

concurrency:
  group: yssl-scraper
  cancel-in-progress: false

jobs:
  scrape-yssl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p data/raw/yssl

      - name: Scrape YSSL, register teams, import games
        if: ${{ env.AGE_ROLLOVER_FREEZE == 'false' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DAYS_BACK_INPUT: ${{ github.event.inputs.days_back }}
          CLUBS_INPUT: ${{ github.event.inputs.clubs }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          # Season to date, not one week: a game held while its team waits in the review
          # queue imports on the first run after the review, and the importer skips
          # games it already holds.
          ARGS=(--days-back "${DAYS_BACK_INPUT:-120}")
          for club in ${CLUBS_INPUT:-}; do
            ARGS+=(--club "${club}")
          done
          if [ "${DRY_RUN_INPUT:-false}" != "true" ]; then
            ARGS+=(--execute)
          fi
          python scripts/import_yssl.py "${ARGS[@]}" | tee data/raw/yssl/run.log

          # A run that read no scored games in season is a broken scrape, not a quiet week.
          GAMES=$(grep -oE 'Games scraped: [0-9]+' data/raw/yssl/run.log | grep -oE '[0-9]+' || echo 0)
          MONTH=$(date -u +%m)
          if [ "${GAMES}" = "0" ] && [[ "${MONTH}" =~ ^(09|10|11|04|05|06)$ ]]; then
            echo "::error::YSSL run read zero scored games in season"
            exit 1
          fi

      - name: Upload CSVs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: yssl-${{ github.run_id }}
          path: data/raw/yssl/
          if-no-files-found: ignore
          retention-days: 30
