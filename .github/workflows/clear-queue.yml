name: Help Clear Queue
run-name: >-
  Clear Queue · ${{
    format('{0} teams', inputs.queue_limit || '2000')
  }}${{
    inputs.use_zenrows == true && ' · ZenRows' || ''
  }}

on:
  workflow_dispatch:
    inputs:
      queue_limit:
        description: 'Do not run concurrent dispatches: the teams-table top-up is not parallel-safe. Total teams to scrape (default 2000) — drains the queue first, then tops up from the teams table, oldest-scraped first, skipping teams scraped in the last 7 days.'
        required: false
        type: string
        default: '2000'
      use_zenrows:
        description: 'Route gotsport API calls through ZenRows residential proxy (bypasses per-IP WAF budget; costs per request)'
        required: false
        type: boolean
        default: false
      zenrows_premium_proxy:
        description: 'When use_zenrows=true: use residential IPs (25x cost). Disable to test datacenter IPs. Ignored when use_zenrows=false.'
        required: false
        type: boolean
        default: true
      concurrency:
        description: 'Number of concurrent scrapes (default: 30 direct, 20 with ZenRows)'
        required: false
        type: string
        default: ''

jobs:
  clear-queue:
    runs-on: ubuntu-latest
    # The import, not the scrape, is what runs long here; see the sizing note
    # in Build command. 360 is GitHub's ceiling for a job.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p logs data/raw data/cache

      - name: Build command
        id: build-command
        env:
          QUEUE_LIMIT: ${{ inputs.queue_limit }}
          USE_ZENROWS: ${{ inputs.use_zenrows }}
          CONCURRENCY_INPUT: ${{ inputs.concurrency }}
        run: |
          CMD="python scripts/drain_queue.py"

          # Queue limit (validated)
          if [[ "$QUEUE_LIMIT" =~ ^[0-9]+$ ]]; then
            CMD="$CMD --limit $QUEUE_LIMIT"
          else
            CMD="$CMD --limit 2000"
          fi

          # Concurrency: 20 with ZenRows, 30 without.
          #
          # ZenRows: 20, not the 8 used by scrape-games.yml. That 8 exists
          # because scrape-games runs 5 shards through one ZenRows API key
          # (5 x 8 = 40, under the Startup-tier 50-slot parallel ceiling).
          # This workflow is a single runner, so one run at 20 is 40% of the
          # cap. That 50-slot ceiling is shared across the whole ZenRows API
          # key, not per workflow — don't run this alongside a ZenRows
          # scrape-games.yml chain, or the combined concurrency can exceed it.
          #
          # Sizing: the team limit does not predict runtime. Wall clock is
          # dominated by the auto-import, which scales with games found rather
          # than teams requested, and a stale queue slice yields an order of
          # magnitude more games per team than a recently-scraped one.
          # Measured 2026-09: run 35497872211 drew 1,817 games from 5,000
          # teams and finished in 44 min, while run 35561221469 drew 69,608
          # games from 8,000 teams and needed ~193 min. Size a batch against
          # how stale the queue is, not its row count. Concurrency 20 holds
          # the scrape phase near an hour at that volume, leaving the rest of
          # the budget for the import. A run killed mid-import keeps the
          # batches it already wrote, and the queue-drain artifact below holds
          # the full scrape for a manual re-import.
          if [[ "${USE_ZENROWS:-false}" == "true" ]]; then
            CONCURRENCY=20
          else
            CONCURRENCY=30
          fi
          if [[ "$CONCURRENCY_INPUT" =~ ^[0-9]+$ ]]; then
            CONCURRENCY="$CONCURRENCY_INPUT"
          fi
          CMD="$CMD --concurrency $CONCURRENCY"

          echo "Command: $CMD"
          echo "command=$CMD" >> "$GITHUB_OUTPUT"

      - name: Drain queue
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:      ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          PYTHONPATH:                ${{ github.workspace }}
          ZENROWS_API_KEY: ${{ inputs.use_zenrows && secrets.ZENROWS_API_KEY || '' }}
          ZENROWS_PREMIUM_PROXY: ${{ inputs.zenrows_premium_proxy && 'true' || 'false' }}
          DRAIN_COMMAND: ${{ steps.build-command.outputs.command }}
        run: |
          eval "$DRAIN_COMMAND"

      - name: Upload scraped data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: queue-drain-${{ github.run_number }}
          path: data/raw/scraped_games_*.jsonl
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: queue-drain-logs-${{ github.run_number }}
          path: logs/*.log
          retention-days: 30
          if-no-files-found: ignore
