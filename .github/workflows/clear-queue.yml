name: Help Clear Queue
run-name: >-
  Clear Queue · ${{
    format('{0} teams', inputs.queue_limit || '2000')
  }}${{
    inputs.use_zenrows == true && ' · ZenRows' || ''
  }}

on:
  workflow_dispatch:
    inputs:
      queue_limit:
        description: 'Total teams to scrape (default 2000). Drains the scrape_requests queue first, then tops up from the teams table (oldest-scraped first, skipping anything scraped in the last 7 days). Queue claims use FOR UPDATE SKIP LOCKED so parallel dispatches split the queue safely — the top-up does NOT, so run one at a time when the queue is short.'
        required: false
        type: string
        default: '2000'
      use_zenrows:
        description: 'Route gotsport API calls through ZenRows residential proxy (bypasses per-IP WAF budget; costs per request)'
        required: false
        type: boolean
        default: false
      zenrows_premium_proxy:
        description: 'When use_zenrows=true: use residential IPs (25x cost). Disable to test datacenter IPs. Ignored when use_zenrows=false.'
        required: false
        type: boolean
        default: true
      concurrency:
        description: 'Number of concurrent scrapes (default: 30 direct, 20 with ZenRows)'
        required: false
        type: string
        default: ''

jobs:
  clear-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p logs data/raw data/cache

      - name: Build command
        id: build-command
        env:
          QUEUE_LIMIT: ${{ inputs.queue_limit }}
          USE_ZENROWS: ${{ inputs.use_zenrows }}
          CONCURRENCY_INPUT: ${{ inputs.concurrency }}
        run: |
          CMD="python scripts/drain_queue.py"

          # Queue limit (validated)
          if [[ "$QUEUE_LIMIT" =~ ^[0-9]+$ ]]; then
            CMD="$CMD --limit $QUEUE_LIMIT"
          else
            CMD="$CMD --limit 2000"
          fi

          # Concurrency: 20 with ZenRows, 30 without.
          #
          # ZenRows: 20, not the 8 used by scrape-games.yml. That 8 exists
          # because scrape-games runs 5 shards through one ZenRows API key
          # (5 x 8 = 40, under the Startup-tier 50-slot parallel ceiling).
          # This workflow is a single runner, so one run at 20 is 40% of the
          # cap.
          #
          # Sizing: run 27104427792 (2026-06-07) scraped 4984 teams in 45m06s
          # at concurrency 10 — 1.84 teams/sec. Now that --limit is a total
          # scrape target, a 20,000-team batch is reachable, and at that rate
          # it needs ~181 min of scraping alone — past the 180-min
          # timeout-minutes below. A killed run never reaches auto-import, so
          # every game it scraped is lost to Supabase. 20 roughly halves the
          # scrape to ~90 min, leaving real margin under the cap.
          if [[ "${USE_ZENROWS:-false}" == "true" ]]; then
            CONCURRENCY=20
          else
            CONCURRENCY=30
          fi
          if [[ "$CONCURRENCY_INPUT" =~ ^[0-9]+$ ]]; then
            CONCURRENCY="$CONCURRENCY_INPUT"
          fi
          CMD="$CMD --concurrency $CONCURRENCY"

          echo "Command: $CMD"
          echo "command=$CMD" >> "$GITHUB_OUTPUT"

      - name: Drain queue
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:      ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          PYTHONPATH:                ${{ github.workspace }}
          ZENROWS_API_KEY: ${{ inputs.use_zenrows && secrets.ZENROWS_API_KEY || '' }}
          ZENROWS_PREMIUM_PROXY: ${{ inputs.zenrows_premium_proxy && 'true' || 'false' }}
          DRAIN_COMMAND: ${{ steps.build-command.outputs.command }}
        run: |
          eval "$DRAIN_COMMAND"

      - name: Upload scraped data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: queue-drain-${{ github.run_number }}
          path: data/raw/scraped_games_*.jsonl
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: queue-drain-logs-${{ github.run_number }}
          path: logs/*.log
          retention-days: 30
          if-no-files-found: ignore
