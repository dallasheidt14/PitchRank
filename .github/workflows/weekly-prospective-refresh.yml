name: Daily Prospective Forecast Capture

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      retry_errors:
        description: Retry previously failed database forecasts
        type: boolean
        default: false
      execute:
        description: "Write forecasts (leave off for a read-only preview)"
        type: boolean
        default: false
      limit:
        description: "Maximum fixtures; use 20 for the initial pilot"
        type: string
        default: "500"

concurrency:
  group: prospective-heuristic-processing
  cancel-in-progress: false

jobs:
  capture:
    # Enable only after the migration and 20-fixture pilot have been verified.
    if: vars.COMPARE_CAPTURE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute }}
      CAPTURE_LIMIT: ${{ inputs.limit || '500' }}
      HEURISTIC_STATUS: ${{ inputs.retry_errors && 'error' || 'pending' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          # Keep the registered studies on their original collecting predictor.
          ref: 15cc5f4f38858f2a48a3ac2aeaef8f2bab76c81b
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Audit collection coverage without inspecting results
        if: env.HEURISTIC_STATUS == 'pending'
        shell: bash
        run: |
          MODE=()
          if [ "$EXECUTE" = "true" ]; then MODE+=(--execute --output "$RUNNER_TEMP/prospective-coverage.json"); fi
          python scripts/audit_compare_collection.py --limit "$CAPTURE_LIMIT" "${MODE[@]}"
      - name: Prepare stored fixtures
        if: env.HEURISTIC_STATUS == 'pending'
        shell: bash
        run: |
          MODE=()
          if [ "$EXECUTE" = "true" ]; then MODE+=(--execute); fi
          python scripts/prepare_prospective_match_predictions.py --database \
            --selection balanced --limit "$CAPTURE_LIMIT" "${MODE[@]}" \
            --summary-path "$RUNNER_TEMP/prospective-intake.json"
      - name: Freeze current Compare forecasts
        id: freeze
        working-directory: frontend
        shell: bash
        run: |
          MODE=()
          if [ "$EXECUTE" = "true" ]; then MODE+=(--execute); fi
          npm run process:prospective:heuristic -- --source database --status "$HEURISTIC_STATUS" \
            --selection balanced --limit "$CAPTURE_LIMIT" --concurrency 4 --budget-minutes 45 "${MODE[@]}" \
            --summary-path "$RUNNER_TEMP/prospective-capture.json"
      - name: Upload capture summaries
        if: always() && env.EXECUTE == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: prospective-capture-${{ github.run_id }}
          path: ${{ runner.temp }}/prospective-*.json
          retention-days: 90
          if-no-files-found: error
      - name: Preserve frozen forecast inputs locally
        id: archive
        if: >-
          !cancelled() && (steps.freeze.outcome == 'success' || steps.freeze.outcome == 'failure') &&
          env.EXECUTE == 'true' && vars.COMPARE_INPUT_ARCHIVE_ENABLED == 'true'
        shell: bash
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/frozen-forecast-inputs"
          python scripts/archive_compare_forecasts.py --execute --output-dir "$ARCHIVE_PATH"
      - name: Checkout archive publisher
        id: publisher
        if: "!cancelled() && steps.archive.outcome == 'success'"
        uses: actions/checkout@v5
        with:
          # Publishing tools can be repaired without changing the locked collecting predictor or archived source.
          ref: ${{ github.sha }}
          path: .archive-publisher
          persist-credentials: false
      - name: Publish frozen forecast inputs privately
        id: publish
        if: "!cancelled() && steps.archive.outcome == 'success' && steps.publisher.outcome == 'success'"
        shell: bash
        run: |
          python .archive-publisher/scripts/publish_ranking_input_archive.py \
            "$RUNNER_TEMP/frozen-forecast-inputs" --execute
      - name: Verify partial capture was archived
        if: "!cancelled() && steps.freeze.outcome == 'failure' && steps.publish.outcome == 'success'"
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "prospective-capture.json").read_text())
          if not (report["errored"] > 0 or report["deadlineReached"] is True):
              raise ValueError("Missing partial capture receipt")
          PY
      - name: Summarize capture
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              for name in ("coverage", "intake", "capture"):
                  path = Path(os.environ["RUNNER_TEMP"]) / f"prospective-{name}.json"
                  if path.exists():
                      output.write(f"### {name.title()}\n\n```json\n{json.dumps(json.loads(path.read_text()), indent=2)}\n```\n")
              if os.environ["EXECUTE"] != "true":
                  output.write("Read-only preview; summaries are printed in the step logs.\n")
          PY
