name: Daily Prospective Forecast Capture

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      execute:
        description: "Write forecasts (leave off for a read-only preview)"
        type: boolean
        default: false
      limit:
        description: "Maximum fixtures; use 20 for the initial pilot"
        type: string
        default: "500"

concurrency:
  group: prospective-heuristic-processing
  cancel-in-progress: false

jobs:
  capture:
    # Enable only after the migration and 20-fixture pilot have been verified.
    if: github.event_name != 'schedule' || vars.COMPARE_CAPTURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute }}
      CAPTURE_LIMIT: ${{ inputs.limit || '500' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Prepare stored fixtures
        shell: bash
        run: |
          MODE=()
          if [ "$EXECUTE" = "true" ]; then MODE+=(--execute); fi
          python scripts/prepare_prospective_match_predictions.py --database \
            --limit "$CAPTURE_LIMIT" "${MODE[@]}" \
            --summary-path "$RUNNER_TEMP/prospective-intake.json"
      - name: Freeze current Compare forecasts
        working-directory: frontend
        shell: bash
        run: |
          MODE=()
          if [ "$EXECUTE" = "true" ]; then MODE+=(--execute); fi
          npm run process:prospective:heuristic -- --source database \
            --limit "$CAPTURE_LIMIT" --concurrency 4 --budget-minutes 45 "${MODE[@]}" \
            --summary-path "$RUNNER_TEMP/prospective-capture.json"
      - name: Upload capture summaries
        if: always() && env.EXECUTE == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: prospective-capture-${{ github.run_id }}
          path: ${{ runner.temp }}/prospective-*.json
          retention-days: 90
          if-no-files-found: error
      - name: Summarize capture
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              for name in ("intake", "capture"):
                  path = Path(os.environ["RUNNER_TEMP"]) / f"prospective-{name}.json"
                  if path.exists():
                      output.write(f"### {name.title()}\n\n```json\n{json.dumps(json.loads(path.read_text()), indent=2)}\n```\n")
              if os.environ["EXECUTE"] != "true":
                  output.write("Read-only preview; summaries are printed in the step logs.\n")
          PY
