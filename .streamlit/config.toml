[global]
# Restoring an interrupted Seeding build sets its cohort pickers through session
# state; the pickers still carry a default for a fresh page, which is intended.
disableWidgetStateDuplicationWarning = true

[theme]
primaryColor = "#1f77b4"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
port = 8501
# The apps hold the service-role key and have no login, so they listen only on
# this machine, and Streamlit's origin check turns away most pages from other
# sites. A DNS-rebinding page still passes it.
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true
# Use the polling watcher: the default watchdog-based watcher crashes on
# Windows when site-packages and the repo live on different drives
# (os.path.commonpath raises ValueError, killing the watcher thread).
fileWatcherType = "poll"

[browser]
gatherUsageStats = false
