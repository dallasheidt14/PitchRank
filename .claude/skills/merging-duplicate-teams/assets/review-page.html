<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{
  --bg:#f3f6f4; --surface:#ffffff; --sunk:#eef3f1; --ink:#15231f; --muted:#5b6b66; --line:#d8e1dd;
  --pitch:#0b5345; --pitch-soft:#e3efeb;
  --go:#1f7a4d; --go-bg:#e2f3ea; --stop:#b3261e; --stop-bg:#fbe6e4; --maybe:#8a6a00; --maybe-bg:#fdf3d0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1614; --surface:#16211e; --sunk:#111a18; --ink:#e6eeeb; --muted:#9aaba5; --line:#2a3833;
    --pitch:#5fc2a8; --pitch-soft:#1b2d28;
    --go:#6fd49c; --go-bg:#173326; --stop:#ff8a80; --stop-bg:#3a1b19; --maybe:#f0cf5a; --maybe-bg:#352c10;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1614; --surface:#16211e; --sunk:#111a18; --ink:#e6eeeb; --muted:#9aaba5; --line:#2a3833;
  --pitch:#5fc2a8; --pitch-soft:#1b2d28;
  --go:#6fd49c; --go-bg:#173326; --stop:#ff8a80; --stop-bg:#3a1b19; --maybe:#f0cf5a; --maybe-bg:#352c10;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
h1{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:600;font-size:28px;margin:0;text-wrap:balance}
.intro{color:var(--muted);margin:0;max-width:68ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.bar select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.tally{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums}
.tally span{padding:3px 8px;border-radius:999px}
.t-go{background:var(--go-bg);color:var(--go)} .t-stop{background:var(--stop-bg);color:var(--stop)} .t-maybe{background:var(--maybe-bg);color:var(--maybe)} .t-left{background:var(--pitch-soft);color:var(--pitch)}
.status{font-size:13px;color:var(--muted)}
.pair{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px}
.pair[hidden]{display:none}
.pair[data-d="merge"]{border-left-color:var(--go)} .pair[data-d="separate"]{border-left-color:var(--stop)} .pair[data-d="unsure"]{border-left-color:var(--maybe)}
.head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.num{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:500;font-size:13px;color:var(--muted);letter-spacing:.04em}
.meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chip{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;background:var(--pitch-soft);color:var(--pitch)}
.chip.held{background:var(--maybe-bg);color:var(--maybe)} .chip.rejected{background:var(--stop-bg);color:var(--stop)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{background:var(--sunk);border-radius:6px;padding:10px;display:grid;gap:3px;align-content:start}
.team .role{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.team .name{font-weight:700;overflow-wrap:anywhere}
.team .orig,.team .facts{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.why{font-size:14px;border-left:3px solid var(--line);padding-left:10px;margin:0}
.why b{font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts button{font:inherit;font-size:13px;font-weight:500;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.acts button:focus-visible,.bar select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.acts button[aria-pressed="true"].b-merge{background:var(--go-bg);color:var(--go);border-color:var(--go)}
.acts button[aria-pressed="true"].b-sep{background:var(--stop-bg);color:var(--stop);border-color:var(--stop)}
.acts button[aria-pressed="true"].b-unsure{background:var(--maybe-bg);color:var(--maybe);border-color:var(--maybe)}
.acts button:disabled{opacity:.5;cursor:default}
.swap{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
textarea{font:inherit;font-size:14px;width:100%;min-height:38px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);resize:vertical}
@media (max-width:560px){.teams{grid-template-columns:1fr}}
</style>
<div class="wrap">
  <h1>__TITLE__</h1>
  <p class="intro" id="intro"></p>
  <div class="bar">
    <label for="show">Show</label>
    <select id="show"></select>
    <div class="tally"><span class="t-go" id="n-merge"></span><span class="t-stop" id="n-sep"></span><span class="t-maybe" id="n-unsure"></span><span class="t-left" id="n-left"></span></div>
  </div>
  <div class="status" id="status">Loading saved choices…</div>
  <div id="list"></div>
</div>
<script>
const PAIRS = __DATA__;
// One collection per build, so choices made on an earlier build of this page never mix in.
const COLLECTION = "decisions-__RUN__";
const LABEL = {merge:"Merge them", separate:"Keep separate", unsure:"Not sure"};
const STATUS_LABEL = {held:"Held", rejected:"Rejected", proposed:"Proposed"};
const GENDER = {Male:"boys", Female:"girls"};
const TERMINAL = new Set(["invalid_argument","revoked","quota_exceeded","not_granted","capability_disabled","capability_removed","transform_error"]);
const failed = {};         // pairs whose last write failed: their queued writes are dropped
const $ = s => document.querySelector(s);

let db = null, loaded = false, canWrite = true;
let saved = {};            // choices as the store last reported them
let local = {};            // choices as this page shows them, ahead of the store while a write is in flight
const queue = {};          // one write at a time per pair
const pending = {};        // writes queued or running per pair
const cards = new Map();

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function month(d){ return d ? d.slice(0,7) : "—"; }
function choice(id){ return local[id] || saved[id] || {}; }

function teamBlock(r, stays){
  const d=el("div","team");
  d.append(el("div","role", stays ? "Stays" : "Merged away"), el("div","name", r.name || "(no name)"));
  if (r.original && r.original !== r.name) d.append(el("div","orig", "Registered as: " + r.original));
  let facts = `${r.provider || "?"} · ${r.club || "no club"} · ${r.games} game${r.games==1?"":"s"}`;
  if (r.games) facts += ` · ${month(r.first)} to ${month(r.last)}`;
  if (r.excluded) facts += ` · ${r.excluded} excluded`;
  d.append(el("div","facts", facts));
  return d;
}

function buildPage(){
  const statuses = [...new Set(PAIRS.map(p => p.status))];
  const show = $("#show");
  for (const [value, text] of [["","All"],["open","Not decided"], ...statuses.map(s => [s, STATUS_LABEL[s] + " only"])]){
    const o = document.createElement("option"); o.value = value; o.textContent = text; show.append(o);
  }
  const counts = statuses.map(s => `${PAIRS.filter(p => p.status === s).length} ${STATUS_LABEL[s].toLowerCase()}`).join(", ");
  $("#intro").textContent = `${PAIRS.length} pairs (${counts}) that the rules could not settle. For each one, choose Merge them, Keep separate or Not sure. If you merge, the "stays" team survives; tick the box to keep the other one instead. Add a note if you know something the data doesn't. Everything saves as you go, and Claude reads it back. Nothing is merged until you confirm afterwards.`;
  const storeKey = "review-show:" + COLLECTION;
  try { const v = localStorage.getItem(storeKey); if (v != null) show.value = v; } catch(e){}
  show.addEventListener("change", () => { try { localStorage.setItem(storeKey, show.value); } catch(e){} paint(); });

  for (const p of PAIRS){
    const m = p.rows[0], k = p.rows[1];
    const card = el("div","pair");
    const head = el("div","head");
    head.append(el("span","num", "#" + p.n), el("span","chip " + p.status, STATUS_LABEL[p.status]),
      el("span","meta", `${k.age || ""} ${GENDER[k.gender] || ""} · ${k.club || m.club || ""}`));
    const teams = el("div","teams");
    card.append(head, teams);
    if (p.reason){ const why=el("p","why"); why.append(el("b",null,"Why: "), document.createTextNode(p.reason)); card.append(why); }
    const acts = el("div","acts"), buttons = {};
    for (const [key,cls] of [["merge","b-merge"],["separate","b-sep"],["unsure","b-unsure"]]){
      const b = el("button",cls,LABEL[key]); b.type="button";
      b.addEventListener("click", () => save(p.id, {decision: choice(p.id).decision===key ? null : key}));
      buttons[key] = b; acts.append(b);
    }
    const lab = el("label","swap"), cb = document.createElement("input"); cb.type="checkbox";
    cb.addEventListener("change", () => save(p.id, {swap: cb.checked}));
    lab.append(cb, document.createTextNode("Keep the other one instead"));
    acts.append(lab);
    const ta = document.createElement("textarea"); ta.placeholder = "Note (optional)"; ta.setAttribute("aria-label", "Note");
    ta.addEventListener("change", () => save(p.id, {note: ta.value.trim()}));
    card.append(acts, ta);
    $("#list").append(card);
    cards.set(p.id, {card, teams, buttons, cb, ta, swapShown: null});
  }
}

// Updates the existing cards in place: rebuilding them would swallow a click landing on a
// button that was replaced mid-press, and wipe a note being typed.
function paint(){
  const show = $("#show").value, editable = loaded && canWrite;
  for (const p of PAIRS){
    const c = cards.get(p.id), s = choice(p.id);
    c.card.hidden = (show==="open" && !!s.decision) || (!!show && show!=="open" && p.status!==show);
    if (s.decision) c.card.dataset.d = s.decision; else delete c.card.dataset.d;
    for (const [key,b] of Object.entries(c.buttons)){ b.setAttribute("aria-pressed", s.decision===key ? "true" : "false"); b.disabled = !editable; }
    c.cb.checked = !!s.swap; c.cb.disabled = !editable; c.ta.disabled = !editable;
    if (document.activeElement !== c.ta) c.ta.value = s.note || "";
    if (c.swapShown !== !!s.swap){
      c.teams.replaceChildren(teamBlock(s.swap ? p.rows[1] : p.rows[0], false), teamBlock(s.swap ? p.rows[0] : p.rows[1], true));
      c.swapShown = !!s.swap;
    }
  }
  const n = {merge: 0, separate: 0, unsure: 0};
  for (const p of PAIRS){ const d = choice(p.id).decision; if (d) n[d] += 1; }
  $("#n-merge").textContent = n.merge + " merge";
  $("#n-sep").textContent = n.separate + " separate";
  $("#n-unsure").textContent = n.unsure + " unsure";
  $("#n-left").textContent = (PAIRS.length - n.merge - n.separate - n.unsure) + " left";
}

function save(id, patch){
  local[id] = {...choice(id), ...patch};
  paint();
  pending[id] = (pending[id] || 0) + 1;
  queue[id] = (queue[id] || Promise.resolve()).then(() => write(id, patch)).finally(() => {
    pending[id] -= 1;
    if (!pending[id]) delete failed[id];
  });
}

// Writes only the fields that changed, and creates a document only after the store says it
// does not exist, so a snapshot running behind cannot replace a saved choice with a whole one.
async function write(id, patch, retried){
  if (failed[id]) return;   // the card has reverted to the stored choice; a queued edit is no longer on screen
  const ref = db.collection(COLLECTION).doc(id);
  const body = {...patch, saved_at: new Date().toISOString()};
  try {
    try { await ref.update(body); }
    catch(e){
      if (!(e && e.code === "invalid_argument") || (await ref.get()).exists) throw e;
      await ref.set({decision: null, swap: false, note: "", ...choice(id), ...body});
    }
  } catch(e){
    const code = e && e.code;
    if (!TERMINAL.has(code) && !retried){
      await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
      return write(id, patch, true);
    }
    failed[id] = true;
    delete local[id];
    if (TERMINAL.has(code)){ canWrite = false; $("#status").textContent = "Changes can't be saved in this view, so the buttons are off."; }
    else $("#status").textContent = "That choice did not save. Try again in a moment.";
    paint();
  }
}

buildPage();
paint();
(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  if (!db){ $("#status").textContent = "Saved choices are unavailable in this view, so the buttons are off."; paint(); return; }
  db.collection(COLLECTION).onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs){ const x = d.data(); if (x) next[d.id] = {decision: x.decision || null, swap: x.swap === true, note: x.note || ""}; }
    saved = next;
    for (const id of Object.keys(local)) if (!pending[id]) delete local[id];
    // A first delivery from cache may not hold choices already saved elsewhere.
    if (!loaded && !(snap.metadata && snap.metadata.fromCache)){ loaded = true; $("#status").textContent = "Choices save automatically."; }
    paint();
  }, () => { $("#status").textContent = "Lost the connection to saved choices. Reload the page."; });
})();
</script>
