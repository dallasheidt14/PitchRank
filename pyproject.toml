[project]
name = "pitchrank"
version = "2.0.0"
description = "Youth soccer ranking system with cross-age and cross-state support"
authors = [
    {name = "Dallas Heidt", email = "dallasheidt14@gmail.com"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --tb=short"
# The ini key, not an addopts flag: pytest 9.0.x silently ignores --strict-markers from addopts.
strict_markers = true
markers = [
    "slow: long-running tests, deselected in quick runs (-m 'not slow')",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# dashboard.py is a large legacy Streamlit admin tool. Enforce real lint rules
# (F, W, E7xx) but exempt line-length rather than hand-wrap ~180 long lines.
"dashboard.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

